<?xml version="1.0" encoding="UTF-8" ?>
<!-- Per-game and system settings for Eglantine (Switch 2). Each choice value
     is the emulator's own value for that setting; eglantine-settings.py
     writes it to qt-config.ini before the game starts. -->
<features>
  <emulator name="eglantine" features="">
    <sharedFeature value="powermode" />
    <sharedFeature value="tdp" />
    <sharedFeature value="platformprofile" />
    <sharedFeature value="videomode" />

    <feature name="CONSOLE MODE" submenu="SYSTEM" value="eglantine_console_mode" description="Docked runs games at their TV resolution, handheld at their portable resolution.">
      <choice name="Docked" value="1" />
      <choice name="Handheld" value="0" />
    </feature>
    <feature name="MEMORY LAYOUT" submenu="SYSTEM" value="eglantine_memory_layout" description="Emulated console memory. Switch 2 games may need 12 GB.">
      <choice name="4 GB" value="0" />
      <choice name="6 GB" value="1" />
      <choice name="8 GB" value="2" />
      <choice name="10 GB" value="3" />
      <choice name="12 GB" value="4" />
    </feature>
    <feature name="LANGUAGE" submenu="SYSTEM" value="eglantine_language" description="The emulated console's language.">
      <choice name="Japanese" value="0" />
      <choice name="English (US)" value="1" />
      <choice name="French" value="2" />
      <choice name="German" value="3" />
      <choice name="Italian" value="4" />
      <choice name="Spanish" value="5" />
      <choice name="Chinese" value="6" />
      <choice name="Korean" value="7" />
      <choice name="Dutch" value="8" />
      <choice name="Portuguese" value="9" />
      <choice name="Russian" value="10" />
      <choice name="Taiwanese" value="11" />
      <choice name="English (UK)" value="12" />
      <choice name="French (Canada)" value="13" />
      <choice name="Spanish (Latin America)" value="14" />
      <choice name="Chinese (Simplified)" value="15" />
      <choice name="Chinese (Traditional)" value="16" />
      <choice name="Portuguese (Brazil)" value="17" />
      <choice name="Polish" value="18" />
      <choice name="Thai" value="19" />
    </feature>
    <feature name="REGION" submenu="SYSTEM" value="eglantine_region" description="The emulated console's region.">
      <choice name="Japan" value="0" />
      <choice name="USA" value="1" />
      <choice name="Europe" value="2" />
      <choice name="Australia" value="3" />
      <choice name="China" value="4" />
      <choice name="Korea" value="5" />
      <choice name="Taiwan" value="6" />
    </feature>

    <feature name="GRAPHICS API" submenu="GRAPHICS" value="eglantine_backend" description="Vulkan is fastest on most hardware.">
      <choice name="Vulkan" value="1" />
      <choice name="OpenGL (GLSL)" value="0" />
      <choice name="OpenGL (GLASM)" value="3" />
      <choice name="OpenGL (SPIR-V)" value="4" />
    </feature>
    <feature name="RESOLUTION" submenu="GRAPHICS" value="eglantine_resolution" description="Internal rendering resolution, as a multiple of the game's own.">
      <choice name="0.25x" value="0" />
      <choice name="0.5x" value="1" />
      <choice name="0.75x" value="2" />
      <choice name="1x (native)" value="3" />
      <choice name="1.25x" value="4" />
      <choice name="1.5x" value="5" />
      <choice name="2x" value="6" />
      <choice name="3x" value="7" />
      <choice name="4x" value="8" />
      <choice name="5x" value="9" />
      <choice name="6x" value="10" />
      <choice name="7x" value="11" />
      <choice name="8x" value="12" />
    </feature>
    <feature name="VSYNC" submenu="GRAPHICS" value="eglantine_vsync" description="FIFO is regular VSync. Immediate and Mailbox lower latency but Immediate may tear.">
      <choice name="Immediate (off)" value="0" />
      <choice name="Mailbox" value="1" />
      <choice name="FIFO (on)" value="2" />
      <choice name="FIFO relaxed" value="3" />
    </feature>
    <feature name="UPSCALING FILTER" submenu="GRAPHICS" value="eglantine_scaling_filter" description="How the picture is scaled to your screen.">
      <choice name="Nearest neighbor" value="0" />
      <choice name="Bilinear" value="1" />
      <choice name="Bicubic" value="2" />
      <choice name="Gaussian" value="3" />
      <choice name="Lanczos" value="4" />
      <choice name="ScaleForce" value="5" />
      <choice name="AMD FSR" value="6" />
      <choice name="Area" value="7" />
      <choice name="Zero-Tangent" value="8" />
      <choice name="B-Spline" value="9" />
      <choice name="Mitchell" value="10" />
      <choice name="Spline-1" value="11" />
      <choice name="MMPX" value="12" />
      <choice name="Snapdragon GSR" value="13" />
      <choice name="Snapdragon GSR (edge)" value="14" />
      <choice name="AMD FSR 3" value="15" />
    </feature>
    <feature name="FSR SHARPNESS" submenu="GRAPHICS" value="eglantine_fsr_sharpness" description="Sharpening for the AMD FSR filters.">
      <choice name="0%" value="0" />
      <choice name="25%" value="25" />
      <choice name="50%" value="50" />
      <choice name="75%" value="75" />
      <choice name="100%" value="100" />
    </feature>
    <feature name="ANTI-ALIASING" submenu="GRAPHICS" value="eglantine_anti_aliasing" description="Smooths jagged edges.">
      <choice name="None" value="0" />
      <choice name="FXAA" value="1" />
      <choice name="SMAA" value="2" />
    </feature>
    <feature name="ASPECT RATIO" submenu="GRAPHICS" value="eglantine_aspect_ratio" description="Picture shape. Anything but 16:9 can break some games.">
      <choice name="16:9" value="0" />
      <choice name="4:3" value="1" />
      <choice name="21:9" value="2" />
      <choice name="16:10" value="3" />
      <choice name="Stretch to screen" value="4" />
    </feature>
    <feature name="FRAME GENERATION" submenu="GRAPHICS" value="eglantine_frame_gen" description="Generates extra frames for smoother motion, at some latency.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="FRAME GENERATION TYPE" submenu="GRAPHICS" value="eglantine_frame_gen_type" description="Which frame generation to use when it is on.">
      <choice name="Lossless Scaling (LSFG)" value="0" />
      <choice name="AMD FSR 3" value="1" />
    </feature>
    <feature name="FRAME GENERATION MULTIPLIER" submenu="GRAPHICS" value="eglantine_frame_gen_multiplier" description="How many frames are shown per real frame.">
      <choice name="2x" value="2" />
      <choice name="3x" value="3" />
      <choice name="4x" value="4" />
    </feature>

    <feature name="GPU ACCURACY" submenu="ADVANCED GRAPHICS" value="eglantine_gpu_accuracy" description="High fixes some graphical glitches but is slower.">
      <choice name="Low" value="0" />
      <choice name="High" value="1" />
    </feature>
    <feature name="DMA ACCURACY" submenu="ADVANCED GRAPHICS" value="eglantine_dma_accuracy" description="Safe fixes some games' graphics but is slower.">
      <choice name="Default" value="0" />
      <choice name="Unsafe" value="1" />
      <choice name="Safe" value="2" />
    </feature>
    <feature name="ASYNCHRONOUS SHADERS" submenu="ADVANCED GRAPHICS" value="eglantine_async_shaders" description="Builds shaders in the background: less stutter, some brief glitches.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="DISK SHADER CACHE" submenu="ADVANCED GRAPHICS" value="eglantine_disk_shader_cache" description="Keeps built shaders on disk, so later runs stutter less.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="ANISOTROPIC FILTERING" submenu="ADVANCED GRAPHICS" value="eglantine_anisotropy" description="Sharpens textures seen at an angle.">
      <choice name="Automatic" value="0" />
      <choice name="Game default" value="1" />
      <choice name="2x" value="2" />
      <choice name="4x" value="3" />
      <choice name="8x" value="4" />
      <choice name="16x" value="5" />
    </feature>
    <feature name="ASTC TEXTURE DECODING" submenu="ADVANCED GRAPHICS" value="eglantine_astc_decode" description="Where ASTC textures are decoded.">
      <choice name="CPU" value="0" />
      <choice name="GPU" value="1" />
      <choice name="CPU (asynchronous)" value="2" />
    </feature>
    <feature name="ASTC RECOMPRESSION" submenu="ADVANCED GRAPHICS" value="eglantine_astc_recompression" description="Recompresses ASTC textures to save video memory.">
      <choice name="Uncompressed" value="0" />
      <choice name="BC1 (low quality)" value="1" />
      <choice name="BC3 (medium quality)" value="2" />
    </feature>
    <feature name="VRAM USAGE" submenu="ADVANCED GRAPHICS" value="eglantine_vram_usage" description="Aggressive uses more video memory for speed.">
      <choice name="Conservative" value="0" />
      <choice name="Aggressive" value="1" />
    </feature>
    <feature name="VIDEO DECODING (NVDEC)" submenu="ADVANCED GRAPHICS" value="eglantine_nvdec" description="How in-game videos are decoded.">
      <choice name="Off" value="0" />
      <choice name="CPU" value="1" />
      <choice name="GPU" value="2" />
    </feature>
    <feature name="FRAME PACING" submenu="ADVANCED GRAPHICS" value="eglantine_frame_pacing" description="Target frame rate for frame pacing.">
      <choice name="Auto" value="0" />
      <choice name="30 FPS" value="1" />
      <choice name="60 FPS" value="2" />
      <choice name="90 FPS" value="3" />
      <choice name="120 FPS" value="4" />
    </feature>
    <feature name="EXTENDED DYNAMIC STATE" submenu="ADVANCED GRAPHICS" value="eglantine_dyna_state" description="Vulkan feature level. Lower it if a game shows graphical errors.">
      <choice name="Disabled" value="0" />
      <choice name="EDS1" value="1" />
      <choice name="EDS2" value="2" />
      <choice name="EDS3" value="3" />
    </feature>

    <feature name="CPU ACCURACY" submenu="CPU" value="eglantine_cpu_accuracy" description="Unsafe is faster, Accurate and Paranoid are slower but safer.">
      <choice name="Auto" value="0" />
      <choice name="Accurate" value="1" />
      <choice name="Unsafe" value="2" />
      <choice name="Paranoid" value="3" />
    </feature>
    <feature name="MULTICORE CPU EMULATION" submenu="CPU" value="eglantine_multicore" description="Uses several CPU cores. Much faster; turn off only to debug.">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="LIMIT SPEED" submenu="CPU" value="eglantine_use_speed_limit" description="Keeps games at their normal speed.">
      <choice name="Off (unlimited)" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="SPEED LIMIT" submenu="CPU" value="eglantine_speed_limit" description="Speed when Limit speed is on, in percent of normal.">
      <choice name="50%" value="50" />
      <choice name="100%" value="100" />
      <choice name="150%" value="150" />
      <choice name="200%" value="200" />
      <choice name="300%" value="300" />
    </feature>
  </emulator>
</features>
